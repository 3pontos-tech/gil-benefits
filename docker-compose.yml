services:
  flamma-db:
    build:
      dockerfile: docker/postgres.Dockerfile
      context: .
    image: postgres.local:18
    container_name: flamma-db
    restart: no
    hostname: dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev_flamma
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    volumes:
      - flamma-db:/var/lib/postgresql
    networks:
      - dev-flamma
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --quiet --username=postgres --dbname=postgres || exit 1']
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 15s

  flamma-redis:
    build:
      dockerfile: docker/redis.Dockerfile
      context: .
    image: redis.local:8
    container_name: flamma-redis
    restart: no
    hostname: dev
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    networks:
      - dev-flamma
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --raw incr ping || exit 1']
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 15s

  flamma-mailpit:
    build:
      dockerfile: docker/mailpit.Dockerfile
      context: .
    image: mailpit.local:1
    container_name: flamma-mailpit
    restart: no
    hostname: dev
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - dev-flamma
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 10s

  flamma-rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: flamma-rustfs
    restart: no
    environment:
      RUSTFS_ACCESS_KEY: '${CLOUDFLARE_R2_ACCESS_KEY_ID:-rustfsadmin}'
      RUSTFS_SECRET_KEY: '${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-rustfsadmin}'
      RUSTFS_CONSOLE_ENABLE: 'true'
      TZ: America/Sao_Paulo
    ports:
      - '${FORWARD_RUSTFS_PORT:-9000}:9000'
      - '${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
    volumes:
      - flamma-rustfs:/data
    networks:
      - dev-flamma
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:9000/health']
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 10s

  flamma-rustfs-bucket:
    image: amazon/aws-cli:2.39.5
    restart: no
    depends_on:
      flamma-rustfs:
        condition: service_healthy
    environment:
      BUCKET: '${CLOUDFLARE_R2_BUCKET:-flamma-rustfs}'
      AWS_ACCESS_KEY_ID: '${CLOUDFLARE_R2_ACCESS_KEY_ID:-rustfsadmin}'
      AWS_SECRET_ACCESS_KEY: '${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-rustfsadmin}'
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://flamma-rustfs:9000
    entrypoint:
      - sh
      - -c
      - |
        aws s3api head-bucket --bucket "$$BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$$BUCKET" &&
        aws s3api put-bucket-policy --bucket "$$BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$BUCKET/*\"]}]}" &&
        aws s3api put-bucket-cors --bucket "$$BUCKET" --cors-configuration "{\"CORSRules\":[{\"AllowedOrigins\":[\"*\"],\"AllowedMethods\":[\"GET\",\"HEAD\",\"PUT\",\"POST\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3000}]}"
    networks:
      - dev-flamma

volumes:
  flamma-db:
    name: flamma-db
  flamma-rustfs:
    name: flamma-rustfs

networks:
  dev-flamma:
    name: dev-flamma
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: dev-flamma
      com.docker.network.bridge.host_binding_ipv4: '127.0.0.1'
